<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportHub - Live Highlights & Scores</title>
    <!-- Tailwind CSS CDN untuk styling profesional -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="bg-indigo-600 text-white font-bold px-3 py-1.5 rounded-lg text-lg">⚽ SportHub</span>
                <span class="text-sm text-slate-400 hidden sm:inline">| Free Highlights & Matches</span>
            </div>
            <div class="relative w-48 sm:w-64">
                <input type="text" id="searchInput" placeholder="Cari tim atau liga..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        <div class="mb-6 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight">Pertandingan & Highlights Terbaru</h1>
            <span id="matchCount" class="text-xs bg-slate-800 text-slate-400 px-3 py-1 rounded-full">Memuat data...</span>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="text-center py-20 text-slate-400">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent mb-4"></div>
            <p>Mengambil data pertandingan terkini...</p>
        </div>

        <!-- Grid Container -->
        <div id="matchesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- Data akan dimuat secara dinamis via JavaScript -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 mt-12 py-6 text-center text-sm text-slate-400">
        <p>&copy; 2026 SportHub. Powered by Free Sports Data & GitHub Pages.</p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const API_URL = 'https://www.scorebat.com/video-api/v1/';

        async function fetchMatches() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                document.getElementById('loading').style.display = 'none';
                const grid = document.getElementById('matchesGrid');
                grid.classList.remove('hidden');
                
                renderMatches(data);
                document.getElementById('matchCount').innerText = `${data.length} Pertandingan`;

                // Fitur Pencarian Real-time
                document.getElementById('searchInput').addEventListener('input', (e) => {
                    const keyword = e.target.value.toLowerCase();
                    const filtered = data.filter(match => match.title.toLowerCase().includes(keyword) || match.competition.name.toLowerCase().includes(keyword));
                    renderMatches(filtered);
                    document.getElementById('matchCount').innerText = `${filtered.length} Pertandingan`;
                });

            } catch (error) {
                document.getElementById('loading').innerHTML = '<p class="text-red-400">Gagal memuat data pertandingan. Silakan coba beberapa saat lagi.</p>';
                console.error('Error fetching data:', error);
            }
        }

        function renderMatches(matches) {
            const grid = document.getElementById('matchesGrid');
            if (matches.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-slate-400 py-10">Tidak ada pertandingan yang ditemukan.</p>';
                return;
            }

            grid.innerHTML = matches.map(match => `
                <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-lg hover:border-indigo-500 transition duration-300 flex flex-col">
                    <div class="p-4 bg-slate-750 border-b border-slate-700 flex justify-between items-center text-xs text-slate-400">
                        <span class="font-semibold text-indigo-400">${match.competition.name}</span>
                        <span>${new Date(match.date).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</span>
                    </div>
                    <div class="p-4 flex-grow">
                        <h3 class="font-bold text-lg mb-3 text-white">${match.title}</h3>
                        <div class="rounded-lg overflow-hidden bg-slate-900 aspect-video flex items-center justify-center">
                            ${match.videos[0] ? match.videos[0].embed : '<span class="text-xs text-slate-500">Video belum tersedia</span>'}
                        </div>
                    </div>
                    <div class="p-4 bg-slate-850 border-t border-slate-700 text-right">
                        <a href="${match.url}" target="_blank" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 rounded-lg transition">Tonton di ScoreBat &rarr;</a>
                    </div>
                </div>
            `).join('');
        }

        fetchMatches();
    </script>
</body>
</html>
